<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="-32 -32 320 320" role="img" aria-label="Есть уведомления"><style>
.bell { fill: #999999; transform-origin: 128px 40px; animation: bell-swing 2.6s infinite, bell-tint 2.6s ease-in-out infinite; }
@keyframes bell-swing {
  0%, 8% { transform: rotate(0deg); animation-timing-function: cubic-bezier(.4,0,.2,1); }
  18% { transform: rotate(16deg); animation-timing-function: cubic-bezier(.37,0,.2,1); }
  32% { transform: rotate(-12deg); animation-timing-function: cubic-bezier(.37,0,.2,1); }
  45% { transform: rotate(8deg); animation-timing-function: cubic-bezier(.37,0,.2,1); }
  57% { transform: rotate(-4deg); animation-timing-function: cubic-bezier(.37,0,.2,1); }
  68% { transform: rotate(1.5deg); animation-timing-function: cubic-bezier(.37,0,.2,1); }
  78%, 100% { transform: rotate(0deg); }
}
@keyframes bell-tint { 0%, 100% { fill: #999999; } 32%, 45% { fill: #f8c89d; } 80% { fill: #999999; } }
@media (prefers-reduced-motion: reduce) { .bell { animation: none; } }
