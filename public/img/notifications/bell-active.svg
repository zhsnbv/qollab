<svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="-32 -32 320 320" role="img" aria-label="Есть уведомления"><style>
.bell { fill: #999999; transform-origin: 128px 40px; animation: bell-swing 1.8s cubic-bezier(.37,0,.63,1) infinite, bell-tint 1.8s ease-in-out infinite; }
@keyframes bell-swing {
  0% { transform: rotate(0deg); }
  8% { transform: rotate(16deg); }
  17% { transform: rotate(-12deg); }
  26% { transform: rotate(8deg); }
  35% { transform: rotate(-5deg); }
  44% { transform: rotate(3deg); }
  53% { transform: rotate(-1.5deg); }
  62% { transform: rotate(.6deg); }
  71%, 100% { transform: rotate(0deg); }
}
@keyframes bell-tint { 0%, 100% { fill: #999999; } 17%, 35% { fill: #f3a158; } 75% { fill: #999999; } }
@media (prefers-reduced-motion: reduce) { .bell { animation: none; } }
