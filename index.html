<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Отключаем зум (pinch/double-tap) и учитываем вырез экрана -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- По умолчанию светлая тема. Тёмная переключается вручную — тапом по
         логотипу qollab на «Главной» (см. utils/theme.js). Системную тему
         пока не слушаем; чтобы вернуть авто — раскомментить блок в скрипте. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <!-- <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" /> -->
    <!-- <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2b2a27" /> -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Qollab" />
    <title>Qollab</title>
    <script>
      // Тёмная тема временно выключена — всегда светлая.
      document.documentElement.dataset.theme = 'light';
      // Статус-бар/адресная строка красятся в цвет топбара (--color-white),
      // иначе в тёмной теме сверху остаётся белая полоса.
      (function () {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = document.documentElement.dataset.theme === 'dark' ? '#2b2a27' : '#ffffff';
      })();
      /* Вернуть системную тему (как Claude iOS):
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function apply() { document.documentElement.dataset.theme = mq.matches ? 'dark' : 'light'; }
        apply();
        mq.addEventListener ? mq.addEventListener('change', apply) : mq.addListener(apply);
      })();
      */
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
