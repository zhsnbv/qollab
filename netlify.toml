# example netlify.toml
[build]
  # Собираем приложение и сторибук: CLI выполняет эту же команду
  # перед выкладкой, поэтому /storybook не теряется.
  command = "npm run build:all"
  functions = "netlify/functions"
  publish = "dist"


  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "yarn start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file

  ## more info on configuring this file: https://ntl.fyi/file-based-build-config

# SPA на BrowserRouter: без этого правила обновление страницы на /profile,
# /services и любом другом маршруте отдаёт 404 — файла с таким путём в dist нет.
# Сторибук — статика, её нельзя заворачивать в SPA-редирект, иначе вместо
# библиотеки компонентов откроется приложение.
[[redirects]]
  from = "/storybook/*"
  to = "/storybook/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
