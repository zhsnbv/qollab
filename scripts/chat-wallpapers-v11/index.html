<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat wallpaper offline renderer</title><style>body{font:15px system-ui;background:#edf0f5;color:#1c2637;margin:24px}header{position:sticky;top:0;padding:16px;background:#fff;z-index:2;border-radius:16px;box-shadow:0 3px 20px #0001}h1{font-size:22px;margin:0 0 12px}button{font:600 16px system-ui;background:#215fd1;color:white;border:0;border-radius:10px;padding:12px 20px;margin-right:10px;cursor:pointer}button:disabled{opacity:.4}#status{white-space:pre-wrap;max-height:220px;overflow:auto;margin-top:12px}progress{display:block;width:100%;margin-top:12px}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:24px}article{background:white;border-radius:12px;padding:12px}canvas{display:block;width:100%;max-height:500px;object-fit:contain;background:#e4e9f0;border-radius:6px}strong,small{display:block;margin-top:7px}small{font-size:11px;color:#637188}</style><header><h1>12 chat wallpapers - deterministic offline export</h1><button id="preview">Preview first frames</button><button id="play">Play 4 families</button><button id="start">Start all exports</button><div id="status">Loading shaders...</div><progress max="1" value="0"></progress></header><main id="grid"></main><script type="module" src="exporter.js"></script></html>
