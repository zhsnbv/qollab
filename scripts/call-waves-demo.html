<!doctype html><html lang="ru"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qollab · Call waves</title><link rel="stylesheet" href="CallWave.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#333;font:14px system-ui;display:flex;gap:32px;justify-content:center;padding:32px;align-items:flex-start}aside{width:260px;position:sticky;top:32px}h1{font-size:22px}label{display:block;margin:20px 0 8px}select,button{width:100%;padding:12px;background:white;border:1px solid #ddd;border-radius:999px;color:#333}button{margin-top:20px}a{color:#a8500a}p{line-height:1.6}.phone{position:relative;isolation:isolate;overflow:hidden;flex-shrink:0;background:white;width:402px;height:820px;box-shadow:0 6px 32px #0001}.hero{position:absolute;top:242px;left:0;right:0;text-align:center}.hero img{width:136px;height:136px;border-radius:50%}.hero h2{font-size:24px;font-weight:500;margin:16px 0 0}.hero p{font-size:15px;color:#999;margin:0}.metrics{font-size:12px;color:#777}@media(max-width:800px){body{flex-direction:column;padding:16px}aside{position:static;width:402px}}
[data-theme=dark] body{background:#1f1e1b;color:#f0eee6}[data-theme=dark] .phone,[data-theme=dark] select,[data-theme=dark] button{background:#2b2a27;color:#f0eee6;border-color:#3d3b36}[data-theme=dark] .hero p,[data-theme=dark] .metrics{color:#a5a096}[data-theme=dark] a{color:#f08a2c}</style><aside><h1>Qollab · волны</h1><p>Эталон движения и состояний. Экран 402×820.</p><label for="status">Состояние звонка</label><select id="status"></select><label for="theme">Тема</label><select id="theme"><option value="light">Светлая</option><option value="dark">Тёмная</option></select><label for="quality">Режим отрисовки</label><select id="quality"><option>full</option><option>lite</option><option>static</option></select><button id="pause">Остановить</button><p class="metrics">Full: размытие, перелив, зерно.<br>Lite: мягкие градиенты.<br>Static: без движения.</p><p><a href="README.md">Интеграция и производительность</a><br><a href="motion-spec.json">Параметры для переноса</a></p></aside><main class="phone"><div class="call-wave" data-quality="full" data-paused="false" aria-hidden="true"><i></i><i></i></div><div class="hero"><img src="avatar.png" alt=""><h2>Арман Асхатов</h2><p id="label">Идёт звонок</p></div></main><script>
const config=__CONFIG__;
const labels={connecting:'Подключение',ringing:'Вызов',incoming:'Входящий звонок',active:'Идёт звонок',reconnecting:'Восстанавливаем соединение',busy:'Линия занята',declined:'Вызов отклонён',unanswered:'Нет ответа',unavailable:'Абонент недоступен',failed:'Не удалось подключиться',ended:'Звонок завершён',canceled:'Вызов отменён',elsewhere:'Ответили на другом устройстве'};
const wave=document.querySelector('.call-wave'),status=document.querySelector('#status'),quality=document.querySelector('#quality'),pause=document.querySelector('#pause');let paused=false;
Object.keys(config.states).forEach(s=>{const option=document.createElement('option');option.value=s;option.textContent=labels[s];status.append(option)});status.value='active';
function update(){const colors=config.palettes[config.states[status.value]];wave.style.setProperty('--wave-light-a',colors[0]);wave.style.setProperty('--wave-light-b',colors[1]);const dark=config.darkPalettes[config.states[status.value]];wave.style.setProperty('--wave-dark-a',dark[0]);wave.style.setProperty('--wave-dark-b',dark[1]);wave.dataset.state=status.value;wave.dataset.quality=quality.value;wave.dataset.paused=paused||document.hidden||quality.value==='static'||!['connecting','ringing','incoming','active','reconnecting'].includes(status.value);document.querySelector('#label').textContent=labels[status.value];pause.textContent=paused?'Продолжить':'Остановить'}
document.querySelector('#theme').onchange=e=>{document.documentElement.dataset.theme=e.target.value;update()};status.onchange=quality.onchange=update;pause.onclick=()=>{paused=!paused;update()};document.addEventListener('visibilitychange',update);update();
</script></html>
